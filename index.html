<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Circle | Business Development</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f11;
            color: #f1f1f5;
            line-height: 1.6;
            padding: 40px 5%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
        }

        p {
            color: #a0a0ab;
            font-size: 1.15rem;
        }

        /* Responsive CSS Grid */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            border: 1px solid #282830;
            transition: transform 0.2s ease, border-color 0.2s ease;
            background-color: #18181c;
        }

        /* Hover effect to show it's clickable */
        .grid img:hover {
            transform: translateY(-4px);
            border-color: #3d3d4a;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Arrow Circle</h1>
        <p>Lead Generation & Commercial Video Assets</p>
    </div>

    <div class="grid">
        <!-- Asset 1: Santa Ana Location -->
        <a href="https://youtu.be/3kATaq5G9sE" target="_blank" rel="noopener noreferrer">
            <img src="images/Elite Stone Jeremy Modern Viral Video YouTube Thumbnail 720px.png" alt="Elite Stone Jeremy Customer Growth Play">
        </a>
        
        <!-- Asset 2: Pomona / Ontario Location -->
        <a href="https://youtu.be/mElbyS-p63Q" target="_blank" rel="noopener noreferrer">
            <img src="images/Red Black White Bold Melissa YouTube Thumbnail 720px.png" alt="Melissa ROI New Customers">
        </a>
    </div>

</body>
</html>
